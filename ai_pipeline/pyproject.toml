[tool.poetry]
name = "synthoraai-ai-pipeline"
version = "1.0.0"
description = "Multi-agent AI pipeline for article processing"
authors = ["SynthoraAI Team"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"
langgraph = ">=0.0.40"
langchain = ">=0.1.0"
langchain-google-genai = ">=0.0.8"
python-dotenv = ">=1.0.0"
pymongo = ">=4.6.1"
redis = ">=5.0.1"
pydantic = ">=2.5.3"
fastapi = ">=0.108.0"
uvicorn = ">=0.25.0"

[tool.poetry.dev-dependencies]
pytest = ">=7.4.3"
pytest-asyncio = ">=0.23.2"
black = ">=23.12.1"
mypy = ">=1.8.0"
ruff = ">=0.1.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
